<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unnati Hyundai | Sign in</title><link rel="icon" type="image/png" href="/logo.png"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;background:linear-gradient(125deg,#001e40,#003b70 65%,#007da5);color:#fff;padding:24px}main{width:min(100%,430px)}.brand{text-align:center;margin-bottom:30px}.mark{width:170px;aspect-ratio:528/305;margin:0 auto 18px;border-radius:12px;overflow:hidden;background:#e5e5e5;box-shadow:0 8px 24px #00152a55}.mark img{width:100%;height:100%;object-fit:contain;display:block}h1{font-size:32px;margin-bottom:8px}.brand p{color:#c0d7e8;letter-spacing:2px;font-size:12px}.card{background:#fff;border-radius:16px;padding:32px;color:#002c5f;box-shadow:0 20px 70px #00152a66}h2{margin:0 0 8px}.intro{color:#607080;font-size:14px;margin-bottom:24px}label{display:block;margin:18px 0 8px;font-size:14px;font-weight:600}input{width:100%;padding:14px;border:1px solid #b5c4d3;border-radius:6px;font-size:16px}input:focus{outline:2px solid #007fa8;outline-offset:2px}button{margin-top:24px;width:100%;border:0;border-radius:6px;background:#002c5f;color:white;padding:15px;font-size:16px;cursor:pointer}button:disabled{opacity:.6}#error{color:#b02121;font-size:14px;line-height:1.5}footer{text-align:center;color:#c0d7e8;font-size:12px;margin:24px}
</style></head><body><main><div class="brand"><div class="mark"><img src="/logo.png" alt="Hyundai logo"></div><h1>Unnati Hyundai</h1><p>DEALERSHIP PERFORMANCE DASHBOARD</p></div><div class="card"><h2>Welcome</h2><p class="intro">Sign in to view your authorised dashboard screens.</p><form id="login"><label for="user">User ID</label><input id="user" name="user_id" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><p id="error" role="alert"></p><button id="submit">Sign in</button></form></div><footer>Unnati Hyundai · Enquiry to Retail</footer></main><script>
document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('submit'),error=document.getElementById('error');b.disabled=true;error.textContent='';try{const r=await fetch('/api/auth/login',{method:'POST',body:new URLSearchParams(new FormData(e.target))});const data=await r.json();if(!r.ok)throw new Error(data.detail||'Unable to sign in.');window.location.replace('/');}catch(err){error.textContent=err.message;}finally{b.disabled=false;}});
</script></body></html>
